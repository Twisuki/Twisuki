name: Waka Readme

on:
  # 手动触发
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update Waka Readme
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Twisuki/custom_waka_readme@v2
        with:
          profile_path: profile.md
          output_path: README.md
          wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          commit_author: TwisWakaBot
          commit_email: 100500860+Twisuki@users.noreply.github.com
          commit_message: "feat: Update custom waka readme"